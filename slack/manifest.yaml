# Slack App manifest for the Bob harness bot.
#
# Use this to create the app in one step:
#   1. Go to https://api.slack.com/apps  ->  "Create New App"  ->  "From a manifest"
#   2. Pick your workspace, paste this file.
#   3. Install the app to the workspace.
#   4. Copy the Bot User OAuth Token (xoxb-...) into SLACK_BOT_TOKEN.
#   5. Under "Basic Information" -> "App-Level Tokens", generate a token with the
#      connections:write scope and copy it (xapp-...) into SLACK_APP_TOKEN.
#   6. Invite the bot to your channel:  /invite @Bob
#
# Socket Mode is enabled below, so no public request URL is required.
display_information:
  name: Bob
  description: Talk to the Bob Shell harness from Slack — no @-mention needed.
  background_color: "#1f2937"

features:
  bot_user:
    display_name: Bob
    always_online: true

oauth_config:
  scopes:
    bot:
      # Post replies.
      - chat:write
      # Read messages in public channels the bot is a member of (so it can
      # respond without being mentioned).
      - channels:history
      # Download images and documents attached to messages.
      - files:read

settings:
  event_subscriptions:
    bot_events:
      # Every new message in a channel the bot is in.
      - message.channels
  # Outbound WebSocket — no public URL to expose.
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
